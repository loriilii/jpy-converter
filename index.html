<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日幣台幣快速換算器</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        .rate-settings {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .rate-box {
            flex: 1;
            background: #f1f4f8;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .rate-box label {
            margin-bottom: 4px;
            font-size: 0.8rem;
            color: #666;
        }

        .rate-box input {
            width: 100%;
            padding: 6px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #fff;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .result-card {
            background: #f8fafc;
            border-left: 5px solid var(--accent-color);
            padding: 14px 16px;
            border-radius: 0 8px 8px 0;
        }

        .result-card.fixed {
            border-left-color: #e67e22;
        }

        .result-title {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .table-container {
            margin-top: 20px;
        }

        .table-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f4f8;
            color: #444;
            font-weight: 600;
        }

        td:last-child, th:last-child {
            text-align: right;
        }

        .status-text {
            font-size: 0.75rem;
            text-align: center;
            color: #888;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🇯🇵 日幣 ⇄ 台幣 換算器</h1>

    <!-- 輸入日幣金額 -->
    <div class="input-group">
        <label for="jpyInput">輸入日幣金額 (JPY)</label>
        <input type="number" id="jpyInput" placeholder="請輸入金額，例如: 5000" value="1000" min="0">
    </div>

    <!-- 匯率設定區 -->
    <div class="rate-settings">
        <div class="rate-box">
            <label for="spotRateInput">1. 即期匯率 (TWD/JPY)</label>
            <input type="number" id="spotRateInput" step="0.0001" value="0.2150">
        </div>
        <div class="rate-box">
            <label for="fixedRateInput">2. 固定匯率</label>
            <input type="number" id="fixedRateInput" step="0.0001" value="0.2300">
        </div>
    </div>

    <!-- 換算結果區 -->
    <div class="results">
        <div class="result-card">
            <div class="result-title">即期匯率換算台幣</div>
            <div class="result-value" id="spotResult">NT$ 0.00</div>
        </div>
        <div class="result-card fixed">
            <div class="result-title">固定匯率 (0.23) 換算台幣</div>
            <div class="result-value" id="fixedResult">NT$ 0.00</div>
        </div>
    </div>

    <!-- 固定對照表 (依即期匯率) -->
    <div class="table-container">
        <div class="table-title">常用即期金額對照表</div>
        <table>
            <thead>
                <tr>
                    <th>日幣 (JPY)</th>
                    <th>台幣 (TWD)</th>
                </tr>
            </thead>
            <tbody id="refTableBody">
                <!-- 動態生成 -->
            </tbody>
        </table>
    </div>

    <div class="status-text" id="statusText">正在自動取得最新即期匯率...</div>
</div>

<script>
    const jpyInput = document.getElementById('jpyInput');
    const spotRateInput = document.getElementById('spotRateInput');
    const fixedRateInput = document.getElementById('fixedRateInput');
    const spotResult = document.getElementById('spotResult');
    const fixedResult = document.getElementById('fixedResult');
    const refTableBody = document.getElementById('refTableBody');
    const statusText = document.getElementById('statusText');

    // 自動抓取即期匯率 (使用開源 API: ExchangeRate-API)
    async function fetchExchangeRate() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/JPY');
            const data = await response.json();
            if (data && data.rates && data.rates.TWD) {
                // TWD 代表 1 JPY 可以兌換多少 TWD
                const rate = data.rates.TWD;
                spotRateInput.value = rate.toFixed(4);
                statusText.innerText = `已自動更新最新即期匯率 (更新時間: ${data.time_last_update_utc.slice(0, 16)})`;
                calculate();
            } else {
                throw new Error('API 格式錯誤');
            }
        } catch (error) {
            console.error('無法取得即期匯率:', error);
            statusText.innerText = '無法自動取得匯率，已使用預設值，可手動修改';
            calculate();
        }
    }

    // 計算邏輯
    function calculate() {
        const jpy = parseFloat(jpyInput.value) || 0;
        const spotRate = parseFloat(spotRateInput.value) || 0;
        const fixedRate = parseFloat(fixedRateInput.value) || 0.23;

        // 計算結果
        const spotTwd = jpy * spotRate;
        const fixedTwd = jpy * fixedRate;

        spotResult.innerText = `NT$ ${spotTwd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        fixedResult.innerText = `NT$ ${fixedTwd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        // 更新對照表 (100, 1000, 10000, 100000)
        const refAmounts = [100, 1000, 10000, 100000];
        refTableBody.innerHTML = '';
        refAmounts.forEach(amount => {
            const converted = amount * spotRate;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>¥ ${amount.toLocaleString()}</td>
                <td>NT$ ${converted.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</td>
            `;
            refTableBody.appendChild(row);
        });
    }

    // 監聽輸入事件
    jpyInput.addEventListener('input', calculate);
    spotRateInput.addEventListener('input', calculate);
    fixedRateInput.addEventListener('input', calculate);

    // 初始化執行
    fetchExchangeRate();
</script>

</body>
</html>
