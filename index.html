<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日幣台幣快速換算器</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --fixed-color: #e67e22;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            color: var(--primary-color);
        }

        input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        .rate-settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .rate-box {
            background: #f1f4f8;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .rate-box label {
            margin-bottom: 4px;
            font-size: 0.75rem;
            color: #666;
        }

        /* 唯讀的即期匯率樣式 */
        .rate-box input.readonly-rate {
            width: 100%;
            padding: 6px;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #e9ecef;
            color: #495057;
            cursor: not-allowed;
        }

        /* 可手動改的固定匯率樣式 */
        .rate-box input.editable-rate {
            width: 100%;
            padding: 6px;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #fff;
            color: var(--primary-color);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .result-card {
            background: #f8fafc;
            border-left: 5px solid var(--accent-color);
            padding: 14px 16px;
            border-radius: 0 8px 8px 0;
        }

        .result-card.fixed {
            border-left-color: var(--fixed-color);
            background: #fffdf9;
        }

        .result-title {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .table-container {
            margin-top: 15px;
        }

        .table-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f4f8;
            color: #444;
            font-weight: 600;
        }

        td:last-child, th:last-child {
            text-align: right;
        }

        .status-text {
            font-size: 0.75rem;
            text-align: center;
            color: #888;
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🇯🇵 日幣台幣快速換算</h1>

    <!-- 輸入日幣金額 -->
    <div class="input-group">
        <label for="jpyInput">輸入日幣金額 (JPY)</label>
        <input type="number" id="jpyInput" placeholder="請輸入金額，例如: 5000" value="1000" min="0">
    </div>

    <!-- 匯率設定區 -->
    <div class="rate-settings">
        <div class="rate-box">
            <label for="spotRateInput">1. 即期匯率 (自動更新)</label>
            <input type="number" id="spotRateInput" class="readonly-rate" value="0.2150" readonly tabindex="-1">
        </div>
        <div class="rate-box">
            <label for="fixedRateInput">2. 固定匯率</label>
            <input type="number" id="fixedRateInput" class="editable-rate" step="0.0001" value="0.2300">
        </div>
    </div>

    <!-- 換算結果區 -->
    <div class="results">
        <div class="result-card">
            <div class="result-title">即期匯率換算</div>
            <div class="result-value" id="spotResult">NT$ 0.00</div>
        </div>
        <div class="result-card fixed">
            <div class="result-title">固定匯率換算</div>
            <div class="result-value" id="fixedResult">NT$ 0.00</div>
        </div>
    </div>

    <!-- 固定對照表 (100, 1000, 10000, 100000) -->
    <div class="table-container">
        <div class="table-title">常用金額對照表 (依即期匯率)</div>
        <table>
            <thead>
                <tr>
                    <th>日幣 (JPY)</th>
                    <th>台幣 (TWD)</th>
                </tr>
            </thead>
            <tbody id="refTableBody">
                <!-- 動態生成 -->
            </tbody>
        </table>
    </div>

    <div class="status-text" id="statusText">正在自動連線取得最新即期匯率...</div>
</div>

<script>
    const jpyInput = document.getElementById('jpyInput');
    const spotRateInput = document.getElementById('spotRateInput');
    const fixedRateInput = document.getElementById('fixedRateInput');
    const spotResult = document.getElementById('spotResult');
    const fixedResult = document.getElementById('fixedResult');
    const refTableBody = document.getElementById('refTableBody');
    const statusText = document.getElementById('statusText');

    // 1. 初始化：載入網頁時，先檢查瀏覽器有沒有存過固定匯率，有就帶入，沒有才用預設 0.23
    const savedFixedRate = localStorage.getItem('userFixedRate');
    if (savedFixedRate) {
        fixedRateInput.value = savedFixedRate;
    }
